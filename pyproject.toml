[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "signaldesk"
version = "1.0.0"
description = "Reproducible support intent classification with calibrated review policies and monitoring"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "numpy==2.2.6", "scipy==1.15.3", "scikit-learn==1.7.2",
  "pandas==2.2.3", "joblib==1.5.2", "fastapi==0.119.1",
  "uvicorn==0.38.0", "pydantic==2.12.3", "streamlit==1.50.0",
  "requests==2.32.5", "plotly==6.3.1"
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1", "ruff==0.14.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires the trained model and bundled data"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
