name: Verify SignalDesk
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check src app tests scripts
      - name: Rebuild artifacts from verified source data
        run: |
          python -m signaldesk.data --data-dir data/raw
          python -m signaldesk.train --data-dir data/raw --artifact-dir artifacts
      - run: python -m pytest -q
      - name: Start the complete container stack
        run: docker compose up -d --build --wait --wait-timeout 90
      - name: Verify API, dashboard, batch, feedback, and monitoring
        run: python scripts/verify_stack.py --report .work/stack-verification.json
      - name: Record container logs
        if: always()
        run: |
          mkdir -p .work
          docker compose logs --no-color > .work/container.log 2>&1
          docker compose down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report
          path: |
            artifacts/metrics.json
            artifacts/manifest.json
            .work/stack-verification.json
            .work/container.log
