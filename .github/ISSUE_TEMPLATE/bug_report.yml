name: Bug report
description: Report a reproducible failure in training, serving, or the dashboard.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Please use synthetic examples and remove credentials, customer messages, and personal data from logs. For potential vulnerabilities, follow SECURITY.md instead of posting sensitive details.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command, endpoint, or dashboard action and a minimal synthetic input.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your OS, Python version, repository commit, model version, and whether you used Docker or a virtual environment.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste sanitized errors or test output. Screenshots are useful for layout issues.
      render: text
  - type: checkboxes
    id: checked
    attributes:
      label: Before submitting
      options:
        - label: I checked existing issues and removed sensitive information from this report.
          required: true
